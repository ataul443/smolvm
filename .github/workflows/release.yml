name: Release

on:
  push:
    tags: ['zotavm-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Run CI checks first
  # ==========================================================================
  ci:
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # Build agent binary + rootfs on Linux (Docker available)
  # ==========================================================================
  build-agent:
    name: Build Agent & Rootfs (Linux)
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: agent-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: agent-aarch64-cargo-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build agent (aarch64-musl, release-small)
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          cargo build --profile release-small -p smolvm-agent --target aarch64-unknown-linux-musl

      - name: Verify static binary
        run: file target/aarch64-unknown-linux-musl/release-small/smolvm-agent

      - name: Build agent rootfs
        run: |
          AGENT_BINARY=target/aarch64-unknown-linux-musl/release-small/smolvm-agent \
            ./scripts/build-agent-rootfs.sh

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: smolvm-agent-aarch64
          path: target/aarch64-unknown-linux-musl/release-small/smolvm-agent

      - name: Package rootfs as tarball
        run: |
          sudo tar -cf target/agent-rootfs.tar -C target/agent-rootfs .

      - name: Upload agent rootfs
        uses: actions/upload-artifact@v4
        with:
          name: agent-rootfs
          path: target/agent-rootfs.tar

  # ==========================================================================
  # Build main binary + dist on macOS, create release
  # ==========================================================================
  release-macos:
    name: Release (macOS arm64)
    needs: build-agent
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: dist-darwin-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: dist-darwin-arm64-cargo-

      - name: Install build dependencies (macOS)
        run: brew install e2fsprogs llvm

      - name: Verify LFS libraries
        run: |
          ls -la lib/
          file lib/*

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: smolvm-agent-aarch64
          path: target/agent-binary/

      - name: Download agent rootfs
        uses: actions/download-artifact@v4
        with:
          name: agent-rootfs
          path: /tmp/rootfs-dl/

      - name: Extract rootfs tarball
        run: |
          mkdir -p target/agent-rootfs
          sudo tar -xf /tmp/rootfs-dl/agent-rootfs.tar -C target/agent-rootfs

      - name: Place agent binary for build-dist.sh
        run: |
          mkdir -p target/release-small
          cp target/agent-binary/smolvm-agent target/release-small/smolvm-agent
          chmod +x target/release-small/smolvm-agent

      # Import Developer ID certificate if available (macOS only).
      - name: Import signing certificate (macOS)
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12

      - name: Build distribution tarball
        run: |
          export PATH="/opt/homebrew/opt/e2fsprogs/bin:/opt/homebrew/opt/e2fsprogs/sbin:/opt/homebrew/opt/llvm/bin:$PATH"
          PREBUILT_AGENT=target/agent-binary/smolvm-agent ./scripts/build-dist.sh --skip-agent-build
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.CODESIGN_IDENTITY || '-' }}

      # Notarize the macOS binary if Developer ID signing was used.
      - name: Notarize (macOS)
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          TARBALL=$(ls dist/smolvm-*.tar.gz)
          xcrun notarytool submit "$TARBALL" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Verify bundled libraries match source
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          DIST_LIB="dist/smolvm-${VERSION}-darwin-arm64/lib"
          echo "Source libraries:"
          ls -la lib/
          echo "Bundled libraries:"
          ls -la "$DIST_LIB"/
          # Verify sizes match (catches stale LFS or copy issues)
          for lib in "$DIST_LIB"/libkrun*; do
            name=$(basename "$lib")
            src="lib/$name"
            if [[ -f "$src" ]] && [[ ! -L "$lib" ]]; then
              src_size=$(wc -c < "$src")
              dst_size=$(wc -c < "$lib")
              if [[ "$src_size" != "$dst_size" ]]; then
                echo "ERROR: $name size mismatch: source=$src_size bundled=$dst_size"
                exit 1
              fi
              echo "OK: $name ($dst_size bytes)"
            fi
          done

      - name: List distribution contents
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          ls -la "dist/smolvm-${VERSION}-darwin-arm64/"

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > checksums.sha256
          cat checksums.sha256

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/zotavm-v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Zota ${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/*.tar.gz \
            dist/checksums.sha256
