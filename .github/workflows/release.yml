name: Release

on:
  push:
    tags: ['zotavm-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  release-macos:
    name: Release (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Install build dependencies
        run: brew install e2fsprogs llvm

      - name: Build agent rootfs
        run: |
          export PATH="/opt/homebrew/opt/e2fsprogs/bin:/opt/homebrew/opt/e2fsprogs/sbin:/opt/homebrew/opt/llvm/bin:$PATH"
          ./scripts/build-agent-rootfs.sh

      - name: Build distribution
        run: |
          export PATH="/opt/homebrew/opt/e2fsprogs/bin:/opt/homebrew/opt/e2fsprogs/sbin:/opt/homebrew/opt/llvm/bin:$PATH"
          ./scripts/build-dist.sh

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/zotavm-v}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/smolvm-*-darwin-arm64.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Zota ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
